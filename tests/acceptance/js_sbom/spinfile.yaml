# spinfile used to test the js_sbom plugin
spin:
    project_name: myapp
    index_url: https://packages.contact.de/tools/stable
plugin_packages:
    - ../../..
plugins:
    - csspin_frontend.js_sbom
contact_elements:
    umbrella: '2026.2'
python:
    version: '3.11.9'
    requirements:
        # Provides the "webmake" entry point the 2027.1 code path invokes
        - -e {spin.project_root}/fake_webmake
