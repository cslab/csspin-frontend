# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
    os: ubuntu-24.04
    tools:
        python: '3.14'
    commands:
        # Install csspin and virtualenv in one call so that pip resolves the
        # platformdirs constraints of both together
        - python -m pip install --upgrade csspin virtualenv
        - PATH="${PWD}/bin:$PATH" spin -C . -f doc/spinfile.yaml provision
        - spin -C . -f doc/spinfile.yaml docs html
        - mkdir -p $READTHEDOCS_OUTPUT/html
        - mv doc/_build/html/* $READTHEDOCS_OUTPUT/html
