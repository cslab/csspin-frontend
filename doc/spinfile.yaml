# This spinfile.yaml is only intended to be used for building the documentation
# using readthedocs.org.

spin:
    project_name: csspin-frontend

plugin_packages:
    - csspin-docs
    - csspin-python[aws_auth]
    - -e .

plugins:
    - csspin_docs.sphinx
    - csspin_frontend:
          - cypress
          - jest
          - js_sbom
          - jsconfig
          - node
    - csspin_java.java

contact_elements:
    umbrella: '2026.1'

java:
    version: '21'

python:
    version: '3.11.9'
    requirements:
        - sphinx-rtd-theme
    aws_auth:
        # required to access Codeartifact for cs.platform, cs.web, ce_services
        enabled: True
        index: 16.1/simple
        key_duration: 600 # 10 minutes
        role_arn: '{CS_AWS_OIDC_ROLE_ARN}'
        client_id: '{CS_AWS_OIDC_CLIENT_ID}'
    requires:
        python: []

node:
    version: '22'

jest:
    source: .
    requires:
        python: []

cypress:
    requires:
        npm: []

sphinx:
    docs: doc

build_rules:
    task docs:
        sources: doc/_schemaref.rst
    doc/_schemaref.rst:
        sources: [src/csspin_frontend]
        spin:
            - schemadoc cypress --rst -o doc/plugins/cypress_schemaref.rst
            - schemadoc jest --rst -o doc/plugins/jest_schemaref.rst
            - schemadoc js_sbom --rst -o doc/plugins/js_sbom_schemaref.rst
            - schemadoc jsconfig --rst -o doc/plugins/jsconfig_schemaref.rst
            - schemadoc node --rst -o doc/plugins/node_schemaref.rst
