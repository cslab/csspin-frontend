# This spinfile.yaml is only intended to be used for building the documentation
# using readthedocs.org.

spin:
    project_name: csspin-frontend

plugin_packages:
    - csspin-docs
    - csspin-python[uv]
    - -e .

plugins:
    - csspin_docs.sphinx
    - csspin_python.uv_provisioner
    - csspin_frontend:
          - cypress
          - jest
          - js_sbom
          - jsconfig
          - node

contact_elements:
    umbrella: '2026.2'

python:
    version: '3.14.2'
    use: python
    requirements:
        - sphinx-rtd-theme
    requires:
        python: []

node:
    version: '22'

jest:
    source: .
    requires:
        # Omit csspin_ce.mkinstance so that spin does not provision cs.platform,
        # sass, yarn, and Java for the docs build
        spin:
            - csspin_frontend.node
            - csspin_python.python
        python: []

cypress:
    requires:
        # Omit csspin_ce.ce_services so that spin does not provision its
        # services (traefik, solr, tika) for the docs build
        spin:
            - csspin_frontend.node
            - csspin_python.python
        npm: []

sphinx:
    docs: doc

uv_provisioner:
    enabled: true

build_rules:
    task docs:
        sources: doc/_schemaref.rst
    doc/_schemaref.rst:
        sources: [src/csspin_frontend]
        spin:
            - schemadoc cypress --rst -o doc/plugins/cypress_schemaref.rst
            - schemadoc jest --rst -o doc/plugins/jest_schemaref.rst
            - schemadoc js_sbom --rst -o doc/plugins/js_sbom_schemaref.rst
            - schemadoc jsconfig --rst -o doc/plugins/jsconfig_schemaref.rst
            - schemadoc node --rst -o doc/plugins/node_schemaref.rst
